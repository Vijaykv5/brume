name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build Next
        run: bun --bun next build --webpack
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DATABASE_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Type check
        run: bunx tsc --noEmit --pretty false

      - name: Build Vinext
        run: bun run build:vinext
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DATABASE_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Verify Cloudflare credentials
        run: bunx wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync Cloudflare Worker secrets
        run: |
          printf '%s' "$DB_URL" | bunx wrangler versions secret put DB_URL --config dist/server/wrangler.json
          printf '%s' "$UPSTASH_REDIS_REST_URL" | bunx wrangler versions secret put UPSTASH_REDIS_REST_URL --config dist/server/wrangler.json
          printf '%s' "$UPSTASH_REDIS_REST_TOKEN" | bunx wrangler versions secret put UPSTASH_REDIS_REST_TOKEN --config dist/server/wrangler.json
          printf '%s' "$GA_PROPERTY_ID" | bunx wrangler versions secret put GA_PROPERTY_ID --config dist/server/wrangler.json
          printf '%s' "$GOOGLE_CLIENT_EMAIL" | bunx wrangler versions secret put GOOGLE_CLIENT_EMAIL --config dist/server/wrangler.json
          printf '%s' "$GOOGLE_PRIVATE_KEY" | bunx wrangler versions secret put GOOGLE_PRIVATE_KEY --config dist/server/wrangler.json
          printf '%s' "$NEXT_PUBLIC_GA_MEASUREMENT_ID" | bunx wrangler versions secret put NEXT_PUBLIC_GA_MEASUREMENT_ID --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Deploy to Cloudflare
        run: bun run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
