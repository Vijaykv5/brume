name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build Next
        run: bun --bun next build --webpack
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DATABASE_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DODO_PAYMENTS_ENABLED: ${{ vars.DODO_PAYMENTS_ENABLED || 'false' }}

      - name: Type check
        run: bunx tsc --noEmit --pretty false

      - name: Build Vinext
        run: bun run build:vinext
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DATABASE_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DODO_PAYMENTS_ENABLED: ${{ vars.DODO_PAYMENTS_ENABLED || 'false' }}

      - name: Verify Cloudflare credentials
        run: bunx wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync core Cloudflare Worker secrets
        run: |
          printf '%s' "$DB_URL" | bunx wrangler versions secret put DB_URL --config dist/server/wrangler.json
          printf '%s' "$UPSTASH_REDIS_REST_URL" | bunx wrangler versions secret put UPSTASH_REDIS_REST_URL --config dist/server/wrangler.json
          printf '%s' "$UPSTASH_REDIS_REST_TOKEN" | bunx wrangler versions secret put UPSTASH_REDIS_REST_TOKEN --config dist/server/wrangler.json
          printf '%s' "$DODO_PAYMENTS_ENABLED" | bunx wrangler versions secret put DODO_PAYMENTS_ENABLED --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DODO_PAYMENTS_ENABLED: ${{ vars.DODO_PAYMENTS_ENABLED || 'false' }}

      - name: Sync Dodo Cloudflare Worker secrets
        if: ${{ vars.DODO_PAYMENTS_ENABLED == 'true' }}
        run: |
          printf '%s' "$DODO_API_KEY" | bunx wrangler versions secret put DODO_API_KEY --config dist/server/wrangler.json
          printf '%s' "$DODO_ENVIRONMENT" | bunx wrangler versions secret put DODO_ENVIRONMENT --config dist/server/wrangler.json
          printf '%s' "$DODO_PRODUCT_ID" | bunx wrangler versions secret put DODO_PRODUCT_ID --config dist/server/wrangler.json
          printf '%s' "$DODO_WEBHOOK_SECRET" | bunx wrangler versions secret put DODO_WEBHOOK_SECRET --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_ENVIRONMENT: ${{ secrets.DODO_ENVIRONMENT }}
          DODO_PRODUCT_ID: ${{ secrets.DODO_PRODUCT_ID }}
          DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}

      - name: Deploy to Cloudflare
        run: bun run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
